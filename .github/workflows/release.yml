name: Release to CurseForge

# CurseForge-only publishing workflow.
#
# IMPORTANT: the old GitHub setting names are intentionally reused:
#   secrets.MODRINTH_TOKEN      = CurseForge upload API token
#   vars.MODRINTH_PROJECT_ID    = numeric CurseForge project ID
# No step in this workflow connects to Modrinth.
#
# Normal releases:
#   * merged PR changing gradle.properties
#   * v* tag push
#   * manual run with mode=current
#
# One-time history import:
#   Actions -> Release to CurseForge -> Run workflow -> mode=all-builds
# This uploads every .jar in builds/ in semantic-version order, OLDEST first
# and NEWEST last. Each successful upload gets a curseforge-published/* marker
# tag, so rerunning safely skips versions that already completed.

on:
  pull_request:
    types: [closed]
    paths:
      - 'gradle.properties'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: What should be published?
        required: true
        default: current
        type: choice
        options:
          - current
          - all-builds

permissions:
  contents: write

env:
  # Legacy names retained at the user's request. These now hold CurseForge data.
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}

jobs:
  publish-current:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'current')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make scripts executable
        run: chmod +x ./gradlew ./scripts/publish-curseforge.sh

      - name: Read versions
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          echo "mod=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches mod_version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.ver.outputs.mod }}"
          ACTUAL="$GITHUB_REF_NAME"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release tag $ACTUAL does not match mod_version=${{ steps.ver.outputs.mod }}. Expected $EXPECTED."
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Locate release jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="build/libs/blockpal-${{ steps.ver.outputs.mod }}.jar"
          if [[ -f "$EXPECTED" ]]; then
            JAR="$EXPECTED"
          else
            JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          fi
          if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
            echo "::error::Could not find the built mod jar."
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Publishing $JAR"

      - name: Publish current version to CurseForge
        run: ./scripts/publish-curseforge.sh current "${{ steps.jar.outputs.path }}" "${{ steps.ver.outputs.mod }}"

  publish-all-builds:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all-builds'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make uploader executable
        run: chmod +x ./scripts/publish-curseforge.sh

      - name: Show build count
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find builds -maxdepth 1 -type f -name '*.jar' | wc -l)"
          echo "Found $COUNT historical jars to process."
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No historical jars found in builds/."
            exit 1
          fi

      - name: One-time publish all historical builds to CurseForge
        run: ./scripts/publish-curseforge.sh all-builds
