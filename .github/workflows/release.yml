name: Release to CurseForge

# CurseForge-only publishing workflow for normal/current releases.
# Legacy GitHub setting names intentionally remain:
#   secrets.MODRINTH_TOKEN   = CurseForge upload API token
#   vars.MODRINTH_PROJECT_ID = numeric CurseForge project ID

on:
  pull_request:
    types: [closed]
    paths:
      - 'gradle.properties'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-current:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Read mod version
        id: ver
        shell: bash
        run: echo "mod=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches mod_version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.ver.outputs.mod }}"
          ACTUAL="$GITHUB_REF_NAME"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release tag $ACTUAL does not match mod_version=${{ steps.ver.outputs.mod }}. Expected $EXPECTED."
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Locate release jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="build/libs/blockpal-${{ steps.ver.outputs.mod }}.jar"
          if [[ -f "$EXPECTED" ]]; then
            JAR="$EXPECTED"
          else
            JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          fi
          if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
            echo "::error::Could not find built mod jar."
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish current version to CurseForge
        uses: ./.github/actions/publish-one-curseforge
        with:
          file: ${{ steps.jar.outputs.path }}
          version: ${{ steps.ver.outputs.mod }}
          curseforge_id: ${{ vars.MODRINTH_PROJECT_ID }}
          curseforge_token: ${{ secrets.MODRINTH_TOKEN }}
