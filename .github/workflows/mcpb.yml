name: Build Claude Desktop MCPB

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build BlockPal.mcpb
        run: python assets/mcpb/build.py

      - name: Verify bundle contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path('assets/BlockPal.mcpb')
          assert p.is_file(), p
          with ZipFile(p) as z:
              names = set(z.namelist())
          required = {'manifest.json', 'server/index.js', 'README.md'}
          missing = required - names
          assert not missing, f'missing from MCPB: {sorted(missing)}'
          print('BlockPal.mcpb OK:', sorted(names))
          PY

      - name: Upload BlockPal.mcpb
        uses: actions/upload-artifact@v4
        with:
          name: BlockPal-Claude-Desktop-MCPB
          path: assets/BlockPal.mcpb
          if-no-files-found: error

  release:
    # A tagged release gets a permanent, easy-to-find MCPB download in addition
    # to the short-lived Actions artifact. PRs and normal pushes never write.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged MCPB
        uses: actions/download-artifact@v4
        with:
          name: BlockPal-Claude-Desktop-MCPB
          path: release

      - name: Attach MCPB to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$(find release -type f -name 'BlockPal.mcpb' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "::error::Downloaded artifact did not contain BlockPal.mcpb"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" \
              --title "Blockpal $GITHUB_REF_NAME" --generate-notes
          fi
