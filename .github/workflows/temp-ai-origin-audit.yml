name: TEMP AI Origin Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-ai-origin-audit.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit current Java line origins
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, collections

          repo = os.environ['REPO']

          def gh(path):
              out = subprocess.check_output(['gh','api','--paginate',path], text=True)
              # --paginate can concatenate JSON arrays; gh --slurp would be cleaner,
              # but normalize either a single array or concatenated arrays here.
              try:
                  v = json.loads(out)
                  return v if isinstance(v, list) else [v]
              except json.JSONDecodeError:
                  dec = json.JSONDecoder(); pos=0; vals=[]
                  while pos < len(out):
                      while pos < len(out) and out[pos].isspace(): pos += 1
                      if pos >= len(out): break
                      v, pos = dec.raw_decode(out, pos)
                      vals.extend(v if isinstance(v,list) else [v])
                  return vals

          prs = gh(f'repos/{repo}/pulls?state=all&per_page=100')
          merged = [p for p in prs if p.get('merged_at')]

          ai_prs=[]; other_prs=[]
          ai_commits=set(); other_pr_commits=set()
          ai_re = re.compile(r'(claude\.ai/code|generated by .*claude|\bclaude code\b|\bchatgpt\b|\bcodex\b|\bopenai\b)', re.I)

          for p in merged:
              branch = ((p.get('head') or {}).get('ref') or '')
              text = ' '.join([p.get('title') or '', p.get('body') or '', branch])
              is_ai = branch.startswith(('claude/','codex/','chatgpt/','openai/')) or bool(ai_re.search(text))
              target = ai_prs if is_ai else other_prs
              target.append({'number':p['number'],'title':p.get('title'),'branch':branch})
              commits = gh(f'repos/{repo}/pulls/{p["number"]}/commits?per_page=100')
              shas = {c['sha'] for c in commits}
              if p.get('merge_commit_sha'): shas.add(p['merge_commit_sha'])
              (ai_commits if is_ai else other_pr_commits).update(shas)

          code_files = subprocess.check_output(
              "git ls-files 'src/main/java/**/*.java' 'src/client/java/**/*.java' 'src/main/java/*.java' 'src/client/java/*.java'",
              shell=True, text=True).splitlines()
          # git pathspec glob behavior can be inconsistent across versions; fallback to grep.
          if not code_files:
              code_files = [x for x in subprocess.check_output(['git','ls-files'], text=True).splitlines()
                            if re.match(r'^src/(main|client)/java/.*\.java$', x)]

          classes=collections.Counter(); commit_lines=collections.Counter(); file_lines=collections.Counter()
          for f in code_files:
              try:
                  out=subprocess.check_output(['git','blame','--line-porcelain','HEAD','--',f], text=True, errors='replace')
              except subprocess.CalledProcessError:
                  continue
              for line in out.splitlines():
                  m=re.match(r'^([0-9a-f]{40}) \d+ \d+(?: \d+)?$', line)
                  if not m: continue
                  sha=m.group(1)
                  if sha in ai_commits: cls='ai_pr'
                  elif sha in other_pr_commits: cls='other_pr'
                  else: cls='direct_or_unclassified'
                  classes[cls]+=1; commit_lines[(cls,sha)]+=1; file_lines[(cls,f)]+=1

          # Enrich the largest direct/unclassified commits so they can be reviewed manually.
          direct=[]
          for (cls,sha),n in commit_lines.most_common():
              if cls!='direct_or_unclassified': continue
              meta=subprocess.check_output(['git','show','-s','--format=%an%x09%ae%x09%s',sha], text=True).rstrip('\n').split('\t',2)
              direct.append({'sha':sha,'lines':n,'author':meta[0] if meta else '', 'email':meta[1] if len(meta)>1 else '', 'subject':meta[2] if len(meta)>2 else ''})

          report={
            'merged_prs':len(merged),
            'ai_marked_merged_prs':len(ai_prs),
            'other_merged_prs':len(other_prs),
            'other_prs':other_prs,
            'current_java_files':len(code_files),
            'current_java_blame_lines':sum(classes.values()),
            'current_lines_by_origin':dict(classes),
            'largest_direct_or_unclassified_commits':direct[:40],
            'largest_ai_pr_line_commits':[{'sha':sha,'lines':n} for (cls,sha),n in commit_lines.most_common() if cls=='ai_pr'][:20]
          }
          with open('.tmp-ai-origin-audit.json','w') as fp: json.dump(report,fp,indent=2)
          print(json.dumps(report,indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-ai-origin-audit.json
          git commit -m 'TEMP: record AI origin audit'
          git push
