name: Publish All Builds to CurseForge

# One-time historical backfill. Each upload is a separate sequential step,
# oldest first, so the newest build is published last.
# Uses the maintained mc-publish action instead of hand-written curl requests.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish 2.1.0
        uses: ./.github/actions/publish-one-curseforge
        with:
          file: builds/ai-assistant-2.1.0.jar
          version: "2.1.0"
          curseforge_id: ${{ vars.MODRINTH_PROJECT_ID }}
          curseforge_token: ${{ secrets.MODRINTH_TOKEN }}

