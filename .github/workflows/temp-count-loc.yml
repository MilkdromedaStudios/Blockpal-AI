name: TEMP Count Source Lines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-count-loc.yml'

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count tracked source lines
        shell: bash
        run: |
          set -euo pipefail

          count_lines() {
            if [[ "$#" -eq 0 ]]; then
              echo 0
            else
              wc -l "$@" | tail -n1 | awk '{print $1}'
            fi
          }

          mapfile -t MOD_JAVA < <(git ls-files | grep -E '^src/(main|client)/java/.*\.java$' || true)
          mapfile -t TEST_JAVA < <(git ls-files | grep -E '^tests/.*\.java$' || true)
          mapfile -t BEDROCK_JS < <(git ls-files | grep -E '^bedrock/.*\.(js|mjs)$' || true)
          mapfile -t PY < <(git ls-files | grep -E '\.py$' || true)
          mapfile -t SH < <(git ls-files | grep -E '\.sh$' || true)
          mapfile -t ALL_CODE < <(git ls-files | grep -E '\.(java|js|mjs|py|sh)$' || true)

          TRACKED="$(git ls-files | wc -l | tr -d ' ')"
          {
            echo "tracked_files=$TRACKED"
            echo "mod_java_files=${#MOD_JAVA[@]}"
            echo "mod_java_lines=$(count_lines "${MOD_JAVA[@]}")"
            echo "test_java_files=${#TEST_JAVA[@]}"
            echo "test_java_lines=$(count_lines "${TEST_JAVA[@]}")"
            echo "bedrock_js_mjs_files=${#BEDROCK_JS[@]}"
            echo "bedrock_js_mjs_lines=$(count_lines "${BEDROCK_JS[@]}")"
            echo "python_files=${#PY[@]}"
            echo "python_lines=$(count_lines "${PY[@]}")"
            echo "shell_files=${#SH[@]}"
            echo "shell_lines=$(count_lines "${SH[@]}")"
            echo "all_code_files=${#ALL_CODE[@]}"
            echo "all_code_lines=$(count_lines "${ALL_CODE[@]}")"
          } > .tmp-loc-report.txt

          cat .tmp-loc-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-loc-report.txt
          git commit -m "TEMP: record LOC stats"
          git push
