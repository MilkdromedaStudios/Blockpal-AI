name: Sync CurseForge Description

# CurseForge's public upload API does not provide a project-description write endpoint.
# The author dashboard does, but it requires an authenticated authors.curseforge.com
# browser cookie. Store the full Cookie header value as CURSEFORGE_AUTHOR_COOKIE.
#
# Legacy repository variable name intentionally remains:
#   vars.MODRINTH_PROJECT_ID = numeric CurseForge project ID

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render README for CurseForge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # CurseForge cannot resolve README-relative media paths. Point them at the
          # exact commit so images remain stable even after later changes to main.
          sed "s#](media/#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/media/#g" \
            README.md > /tmp/README.curseforge.md

          # Ask GitHub to render the Markdown as GFM HTML instead of maintaining a
          # second, separate CurseForge description file.
          jq -Rs --arg context "$GITHUB_REPOSITORY" \
            '{text: ., mode: "gfm", context: $context}' \
            /tmp/README.curseforge.md > /tmp/github-markdown-request.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/markdown' \
            --data-binary @/tmp/github-markdown-request.json \
            > /tmp/curseforge-description.html

          if [[ ! -s /tmp/curseforge-description.html ]]; then
            echo '::error::GitHub returned an empty rendered description.'
            exit 1
          fi

      - name: Update CurseForge project description
        shell: bash
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_AUTHOR_COOKIE: ${{ secrets.CURSEFORGE_AUTHOR_COOKIE }}
        run: |
          set -euo pipefail

          if [[ -z "${CURSEFORGE_PROJECT_ID:-}" ]]; then
            echo '::error::Missing vars.MODRINTH_PROJECT_ID (the numeric CurseForge project ID).'
            exit 1
          fi

          if [[ -z "${CURSEFORGE_AUTHOR_COOKIE:-}" ]]; then
            echo '::error::Missing secrets.CURSEFORGE_AUTHOR_COOKIE. Save the full Cookie header from a logged-in authors.curseforge.com request as this GitHub Actions secret.'
            exit 1
          fi

          jq -n --rawfile description /tmp/curseforge-description.html \
            '{description: $description, descriptionType: 1}' \
            > /tmp/curseforge-description.json

          HTTP_CODE="$(curl --silent --show-error \
            -o /tmp/curseforge-response.txt \
            -w '%{http_code}' \
            -X PUT \
            "https://authors.curseforge.com/_api/projects/description/${CURSEFORGE_PROJECT_ID}" \
            -H "Cookie: ${CURSEFORGE_AUTHOR_COOKIE}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/curseforge-description.json)"

          if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
            echo "::error::CurseForge description update failed with HTTP ${HTTP_CODE}. The author cookie may have expired."
            cat /tmp/curseforge-response.txt || true
            exit 1
          fi

          echo '::notice::CurseForge project description synced from README.md.'
