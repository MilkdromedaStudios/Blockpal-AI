name: build

# Compile check. Run once for every pull request (including non-claude branches
# and fork PRs), plus pushes to main after merge. This avoids the old coverage
# hole where only main and claude/** branch pushes were tested, while also
# avoiding duplicate push + pull_request runs for the same PR commit.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        # PLAYER2_KEY (repo secret) is exposed to the build/CI environment so any
        # build-time check that talks to Player2's cloud can authenticate. Blockpal
        # reads PLAYER2_KEY from the *runtime* environment (never baked into the jar),
        # so the compiled artifact never carries the secret — it stays out of the
        # public download.
        env:
          PLAYER2_KEY: ${{ secrets.PLAYER2_KEY }}
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: blockpal-jar
          path: build/libs/*.jar
          if-no-files-found: error
